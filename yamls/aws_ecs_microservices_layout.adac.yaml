version: '0.2'

metadata:
  name: 'AWS Microservices Reference Architecture'
  author: 'ADAC Test Suite'
  description: 'AWS architecture with CloudFront, WAF, S3 static frontend, ELB, ECS Fargate API and worker clusters, SQS, Secrets Manager, RDS, S3 and Redis data layer, and CloudWatch monitoring'
  created: '2026-08-10'
  adac_version: '1.0'

# Global defaults (1 logical unit = unitSize pixels)
layoutOptions:
  engine: elk
  unitSize: 100
  direction: LR # overall flow: left to right
  gap: 0.3
  containerPadding: { top: 0.5, right: 0.2, bottom: 0.2, left: 0.2 }
  align: center
  justify: start
  edgeSpacing: 0.1
  edgeRouting: orthogonal
  edgeLabels: false # no text on the edges
  labelMaxChars: 16 # most characters on one line of a node label (visual.style.labelMaxChars overrides per node)
  background: false

applications:
  - id: users
    name: Users
    type: user
    technology: Human

  - id: api-service-1
    name: API Service 1
    type: api

  - id: api-service-2
    name: API Service 2
    type: api

  - id: api-service-3
    name: API Service 3
    type: api

  - id: worker-1
    name: Workers 1
    type: worker

  - id: worker-2
    name: Workers 2
    type: worker

  - id: worker-3
    name: Workers 3
    type: worker

infrastructure:
  clouds:
    - id: aws-primary
      provider: aws
      region: us-east-1
      tier: 'primary'

      services:
        # ---------- Static Frontend ----------
        - id: s3-static-frontend
          name: S3 (Static Frontend)
          type: storage
          subtype: s3
          visual:
            layout:
              order: 1

        # ---------- Edge Layer ----------
        - id: cloudfront
          name: AWS CloudFront
          type: network
          subtype: cloudfront

        - id: waf
          name: AWS WAF
          type: security
          subtype: waf

        - id: edge-layer
          type: container
          subtype: edge
          runs:
            - cloudfront
            - waf
          visual:
            layout:
              order: 2
              direction: TB # CloudFront above WAF
              gap: 0.5
              padding: { top: 0.5, right: 0.1, bottom: 0.2, left: 0.1 }
              align: center
              minSize: { width: 1.2, height: 0.1 }

        # ---------- Load Balancer ----------
        - id: alb
          name: AWS Elastic Load Balancing
          type: network
          subtype: elb
          visual:
            layout:
              order: 1 # leftmost inside the VPC

        # ---------- Secrets ----------
        - id: secrets-manager
          name: AWS Secrets Manager
          type: security
          subtype: secrets-manager
          visual:
            layout:
              order: 4

        # ---------- Monitoring ----------
        - id: cloudwatch
          name: Cloudwatch logging and monitoring
          type: monitoring
          subtype: cloudwatch
          visual:
            layout:
              order: 3

        # ---------- Data Layer ----------
        - id: rds
          name: Amazon RDS
          type: database
          subtype: rds

        - id: s3-data
          name: AWS S3 (data bucket)
          type: storage
          subtype: s3

        - id: redis
          name: Redis
          type: storage
          subtype: elasticache

        - id: data-layer
          type: data
          name: Data Layer
          subtype: data
          runs:
            - rds
            - s3-data
            - redis
          visual:
            layout:
              order: 5
              direction: LR # RDS | S3 | Redis in one row
              gap: 0.5
              padding: { top: 0.35, right: 0.2, bottom: 0.2, left: 0.2 }
              justify: space-around
              minSize: { width: 5.32, height: 0.1 }

        # ---------- ECS Clusters ----------
        - id: api-services
          name: API Services
          type: container
          subtype: group
          runs:
            - api-service-1
            - api-service-2
            - api-service-3
          visual:
            layout:
              direction: TB
              gap: 0.0
              padding: { top: 0.45, right: 0.15, bottom: 0.15, left: 0.15 }
              align: center
              minSize: { width: 1.4, height: 0.1 }

        - id: ecs-fargate
          name: ECS Fargate Cluster
          type: compute
          subtype: ecs
          runs:
            - api-services
          visual:
            layout:
              order: 2
              direction: TB # services stacked
              gap: 0.2
              padding: { top: 0.5, right: 0.2, bottom: 0.2, left: 0.2 }
              align: center
              minSize: { width: 2, height: 0.1 }

        - id: sqs
          name: AWS SQS
          type: queue
          subtype: sqs
          visual:
            layout:
              order: 3

        - id: ecs-fargate-worker
          name: ECS Fargate Workers Cluster
          type: compute
          subtype: ecs
          runs:
            - worker-services
          visual:
            layout:
              order: 4
              direction: TB # services stacked
              gap: 0.2
              padding: { top: 0.5, right: 0.2, bottom: 0.2, left: 0.2 }
              align: center
              minSize: { width: 2.4, height: 0.1 }

        - id: worker-services
          name: Worker Services
          type: container
          subtype: group
          runs:
            - worker-1
            - worker-2
            - worker-3
          visual:
            layout:
              direction: TB
              gap: 0.0
              padding: { top: 0.45, right: 0.15, bottom: 0.15, left: 0.15 }
              align: center
              minSize: { width: 1.6, height: 0.1 }

        # ---------- VPC ----------
        - id: vpc-main
          name: VPC
          type: network
          subtype: vpc
          runs:
            - alb
            - ecs-fargate
            - sqs
            - ecs-fargate-worker
            - data-layer
          visual:
            layout:
              order: 5
              direction: LR # ALB, clusters + SQS in a row ...
              itemsPerLine: 4 # exact: 4 in the row (a max of 4 would balance 5 items as 3+2)
              gap: 0.15
              padding: { top: 0.5, right: 0.15, bottom: 0.15, left: 0.15 }
              align: center
              justify: end
              minSize: { width: 0.1, height: 0.1 }

        # ---------- AWS Boundary ----------
        - id: aws-boundary
          type: container
          name: AWS
          subtype: aws-cloud
          runs:
            - s3-static-frontend
            - edge-layer
            - secrets-manager
            - cloudwatch
            - vpc-main
          visual:
            layout:
              direction: TB
              maxItemsPerLine: 3 # column 1: S3, edge layer, CloudWatch; column 2: Secrets, VPC
              gap: 0.2
              align: center
              justify: space-between
              minSize: { width: 0.1, height: 0.1 }

connections:
  - id: users-to-edge
    from: users
    to: edge-layer
    type: api-call
    protocol: HTTPS
    layout:
      fromSide: right
      toSide: left
      routing: orthogonal

  - id: cloudfront-to-s3-static
    from: cloudfront
    to: s3-static-frontend
    type: cdn-origin

  - id: cloudfront-to-waf
    from: cloudfront
    to: waf
    type: api-call

  - id: vpc-to-cloudwatch
    bidirectional: true
    from: vpc-main
    to: cloudwatch
    type: api-call
    layout:
      fromSide: left
      toSide: right
      routing: orthogonal

  - id: edge-to-alb
    from: edge-layer
    to: alb
    type: api-call
    protocol: HTTPS
    layout:
      fromSide: right
      toSide: left
      routing: orthogonal

  - id: alb-to-ecs
    from: alb
    to: ecs-fargate
    type: load-balancing
    protocol: HTTPS
    layout:
      fromSide: right
      toSide: left
      routing: orthogonal

  - id: secrets-to-ecs
    from: secrets-manager
    to: ecs-fargate
    type: api-call

  - id: ecs-to-sqs
    from: ecs-fargate
    to: sqs
    type: message-publish
    layout:
      fromSide: right
      toSide: left
      routing: orthogonal

  - id: sqs-to-worker
    from: sqs
    to: ecs-fargate-worker
    type: message-consume
    layout:
      fromSide: right
      toSide: left
      routing: orthogonal

  - id: ecs-to-data-layer
    bidirectional: true
    from: ecs-fargate
    to: data-layer
    type: database

  - id: ecs-worker-to-data-layer
    bidirectional: true
    from: ecs-fargate-worker
    to: data-layer
    type: database
