name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # the pnpm version comes from "packageManager" in package.json
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Check the release set
        run: node scripts/verify-release.cjs --static

      # the AWS icons that are published are the files committed in git;
      # nothing is downloaded during a release.
      # Builds the four release packages and what they are built from (15 of the
      # 21 workspace packages, in dependency order); web, web-server, vscode,
      # doc, layout and templates are not published and are built in CI.
      - name: Build Packages
        run: >-
          pnpm
          --filter "@mindfiredigital/adac-validator..."
          --filter "@mindfiredigital/adac-icons-aws..."
          --filter "@mindfiredigital/adac-core..."
          --filter "@mindfiredigital/adac-diagram..."
          run build

      # after the build: packages/icons-aws/__tests__/index.test.ts loads dist/index.js
      - name: Test
        run: pnpm run test

      # the release set was checked above; these are the pack and smoke stages of
      # "node scripts/verify-release.cjs", with the tarballs kept: the publish
      # step uploads exactly these files, not a new pack of each package
      - name: Pack and check the release tarballs
        run: node scripts/verify-release.cjs --pack ${{ runner.temp }}/tarballs

      - name: Smoke test the tarballs
        run: node scripts/verify-release.cjs --smoke ${{ runner.temp }}/tarballs

      - name: Authenticate to npmjs
        run: echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > .npmrc

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm changeset:version
          publish: pnpm release:publish
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # the verified tarballs that "pnpm release:publish" publishes
          ADAC_TARBALLS: ${{ runner.temp }}/tarballs
