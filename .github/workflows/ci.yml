# ─────────────────────────────────────────────────────────────
# CI — runs on every pull request and push to main and dev
# ─────────────────────────────────────────────────────────────
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, Lint & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run security audit
        run: pnpm audit --audit-level=high
        continue-on-error: false

      - name: Run linting
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Build all packages
        run: pnpm run build

      # the same three stages as "node scripts/verify-release.cjs" without an
      # argument, with the tarballs kept so that the Node 20 job tests these
      # exact files instead of building them again
      - name: Check the release set
        run: node scripts/verify-release.cjs --static

      - name: Pack and check the release tarballs
        run: node scripts/verify-release.cjs --pack ${{ runner.temp }}/tarballs

      - name: Smoke test the tarballs
        run: node scripts/verify-release.cjs --smoke ${{ runner.temp }}/tarballs

      - name: Upload the release tarballs
        uses: actions/upload-artifact@v7
        with:
          name: release-tarballs
          path: ${{ runner.temp }}/tarballs/*.tgz
          if-no-files-found: error
          retention-days: 7

      - name: Run tests
        run: pnpm run test:coverage

      - name: Upload coverage artifacts
        if: matrix.node-version == 22 && always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-node-${{ matrix.node-version }}
          path: |
            packages/*/coverage/
            !packages/web/coverage/
          retention-days: 14

      - name: Validate frozen lockfile
        run: git diff --exit-code pnpm-lock.yaml

  # The packages are built and packed once, on Node 22 (pnpm 11 needs it), in
  # build-and-test. This job installs those same tarballs and runs them on
  # Node 20, the oldest version they declare. It builds nothing; the install
  # is only for the script's own helpers (js-yaml, typescript).
  smoke-node-20:
    name: Smoke test on Node 20
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download the release tarballs
        uses: actions/download-artifact@v7
        with:
          name: release-tarballs
          path: ${{ runner.temp }}/tarballs

      - name: Setup Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Smoke test the tarballs on Node 20
        run: node scripts/verify-release.cjs --smoke ${{ runner.temp }}/tarballs
